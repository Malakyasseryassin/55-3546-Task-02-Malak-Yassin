spring:
  # ── PostgreSQL + JPA ───────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/lab05db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ── MongoDB ────────────────────────────────────────────────
  data:
    mongodb:
      uri: mongodb://root:rootpass@localhost:27017/lab05mongo?authSource=admin&authMechanism=SCRAM-SHA-256

    # ── Redis ──────────────────────────────────────────────────
    redis:
      host: localhost
      port: 6379
      password: redispass

  # ── Cassandra ──────────────────────────────────────────────
  cassandra:
      contact-points: localhost
      port: 9042
      keyspace-name: lab05ks
      local-datacenter: datacenter1

      schema-action: none   # IMPORTANT (you already have the table)

      request:
        timeout: 20s

      connection:
        connect-timeout: 20s
        init-query-timeout: 20s

  # ── Neo4j ──────────────────────────────────────────────────
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: neo4jpass

  # ── Elasticsearch ──────────────────────────────────────────
  elasticsearch:
    uris: http://localhost:9200

